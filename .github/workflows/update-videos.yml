name: Update YouTube videos

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 6:00 UTC
  workflow_dispatch: {}   # allows manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update video grids from RSS feeds
        run: python scripts/update_videos.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new videos."
          else
            git commit -m "Update videos from YouTube feeds"
            git push
          fi
